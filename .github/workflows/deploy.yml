name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (leave empty for latest)"
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT" = "workflow_run" ]; then
            TAG="$RUN_SHA"
          else
            TAG=$(aws ecr describe-images \
              --repository-name "${{ vars.ECR_REPOSITORY }}" \
              --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' \
              --output text)
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then
            echo "Could not resolve an image tag" && exit 1
          fi

          echo "Deploying image tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -lock-timeout=5m -var="image_tag=${{ steps.tag.outputs.tag }}" -out=tfplan

      - name: Terraform apply
        run: terraform apply -lock-timeout=5m tfplan
     
      - name: Wait for ECS service to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform output -raw ecs_cluster_name)" \
            --services "$(terraform output -raw ecs_service_name)"

      - name: Health check
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 10 --retry-all-errors \
            "$(terraform output -raw app_url)/health"
          echo "Application is healthy"